name: Branch Policy & Code Review Gate

on:
  push:
    branches:
      - '**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  enforce-branch-policy:
    name: Enforce Branching Strategy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate branch name (marketplace action)
        uses: finleyfamily/action-enforce-branch-name@v1.0.4
        with:
          regex: '^(feature)/[A-Za-z0-9._-]+$'
          exclude: 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate PR base/target (ensure base is main or feature/)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.base_ref }}
          PRIMARY_BRANCH: main
        run: |
          set -euo pipefail
          if [[ "${BASE}" == "${PRIMARY_BRANCH}" || "${BASE}" =~ ^feature/ ]]; then
            echo "PR base '${BASE}' is allowed."
          else
            echo "Illegal PR base branch: '${BASE}'. Allowed: '${PRIMARY_BRANCH}' or feature/*"
            exit 1
          fi

      - name: Validate push branch allowed (for push events)
        if: ${{ github.event_name == 'push' }}
        env:
          BR: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PRIMARY_BRANCH: main
        run: |
          set -euo pipefail
          if [[ "${REF_TYPE}" != "branch" ]]; then
            echo "Non-branch push (${REF_TYPE}), skipping."
            exit 0
          fi
          if [[ "${BR}" == "${PRIMARY_BRANCH}" || "${BR}" =~ ^feature/ ]]; then
            echo "Push to '${BR}' is allowed."
          else
            echo "Push to '${BR}' is blocked by branch policy."
            exit 1
          fi

  automated-code-review:
    name: Code Review & Validation Suite
    needs: [enforce-branch-policy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pipeline Execution
        run: |
          echo "Branch policy verified. Proceeding with automated test suites and AI review gates..."
