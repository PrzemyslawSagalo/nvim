name: Branch Policy & Code Review Gate

on:
  push:
    branches:
      - '**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  enforce-branch-policy:
    name: Enforce Branching Strategy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate branch name (marketplace action)
        uses: finleyfamily/action-enforce-branch-name@v1.0.4
        with:
          regex: '^(feature)/[A-Za-z0-9._-]+$'
          exclude: 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate PR base/target (ensure base is main or feature/)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.base_ref }}
          PRIMARY_BRANCH: main
        run: |
          set -euo pipefail
          if [[ "${BASE}" == "${PRIMARY_BRANCH}" || "${BASE}" =~ ^feature/ ]]; then
            echo "PR base '${BASE}' is allowed."
          else
            echo "Illegal PR base branch: '${BASE}'. Allowed: '${PRIMARY_BRANCH}' or feature/*"
            exit 1
          fi

      - name: Validate push branch allowed (for push events)
        if: ${{ github.event_name == 'push' }}
        env:
          BR: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PRIMARY_BRANCH: main
        run: |
          set -euo pipefail
          if [[ "${REF_TYPE}" != "branch" ]]; then
            echo "Non-branch push (${REF_TYPE}), skipping."
            exit 0
          fi
          if [[ "${BR}" == "${PRIMARY_BRANCH}" || "${BR}" =~ ^feature/ ]]; then
            echo "Push to '${BR}' is allowed."
          else
            echo "Push to '${BR}' is blocked by branch policy."
            exit 1
          fi

  automated-code-review:
    name: Code Review & Validation Suite
    needs: [enforce-branch-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Project Environment
        id: detect
        run: |
          echo "=== Analyzing Repository Structure ==="
          IS_NVIM=false
          HAS_LUA=false
          HAS_PYTHON=false
          HAS_SHELL=false
          HAS_NODE=false

          if [[ -f "init.lua" || -d "lua" ]]; then
            echo "Detected Neovim/Lua configuration."
            IS_NVIM=true
            HAS_LUA=true
          elif find . -name "*.lua" -not -path "*/.*" | grep -q .; then
            echo "Detected standalone Lua files."
            HAS_LUA=true
          fi

          if find . -name "*.py" -not -path "*/.*" | grep -q .; then
            echo "Detected Python files."
            HAS_PYTHON=true
          fi

          if find . -name "*.sh" -not -path "*/.*" | grep -q .; then
            echo "Detected Shell scripts."
            HAS_SHELL=true
          fi

          if [[ -f "package.json" ]]; then
            echo "Detected Node.js project."
            HAS_NODE=true
          fi

          echo "is_nvim=${IS_NVIM}" >> "$GITHUB_OUTPUT"
          echo "has_lua=${HAS_LUA}" >> "$GITHUB_OUTPUT"
          echo "has_python=${HAS_PYTHON}" >> "$GITHUB_OUTPUT"
          echo "has_shell=${HAS_SHELL}" >> "$GITHUB_OUTPUT"
          echo "has_node=${HAS_NODE}" >> "$GITHUB_OUTPUT"

      - name: Install System Dependencies & Toolchains
        run: |
          set -euo pipefail
          echo "=== Installing Environment Toolchains ==="
          sudo apt-get update -qq

          PACKAGES=()
          if [[ "${{ steps.detect.outputs.has_shell }}" == "true" ]]; then
            PACKAGES+=(shellcheck)
          fi

          if [[ "${{ steps.detect.outputs.is_nvim }}" == "true" || "${{ steps.detect.outputs.has_lua }}" == "true" ]]; then
            PACKAGES+=(neovim)
          fi

          if [ ${#PACKAGES[@]} -gt 0 ]; then
            sudo apt-get install -y --no-install-recommends "${PACKAGES[@]}"
          fi

          if [[ "${{ steps.detect.outputs.has_python }}" == "true" ]]; then
            python3 -m pip install --upgrade --quiet ruff pytest || true
          fi

      - name: Run Linters & Static Analysis
        run: |
          set -euo pipefail
          echo "=== Running Static Analysis & Linting ==="
          FAILURES=0

          # 1. Lua syntax compilation check
          if [[ "${{ steps.detect.outputs.has_lua }}" == "true" ]]; then
            echo "Verifying Lua syntax..."
            while IFS= read -r -d '' file; do
              if ! nvim --headless --clean -u NONE -c "lua local chunk, err = loadfile('$file'); if not chunk then io.stderr:write(tostring(err) .. '\n'); os.exit(1) end" -c "qa!" 2>&1; then
                echo "::error file=$file::Syntax compilation failure in $file"
                FAILURES=$((FAILURES + 1))
              fi
            done < <(find . -name "*.lua" -not -path "*/.*" -print0)
          fi

          # 2. ShellCheck analysis for shell scripts
          if [[ "${{ steps.detect.outputs.has_shell }}" == "true" ]] && command -v shellcheck >/dev/null 2>&1; then
            echo "Running ShellCheck on shell scripts..."
            while IFS= read -r -d '' script; do
              if ! shellcheck -S warning "$script"; then
                echo "::error file=$script::ShellCheck warning or error in $script"
                FAILURES=$((FAILURES + 1))
              fi
            done < <(find . -name "*.sh" -not -path "*/.*" -print0)
          fi

          # 3. Python linting if applicable
          if [[ "${{ steps.detect.outputs.has_python }}" == "true" ]] && command -v ruff >/dev/null 2>&1; then
            echo "Running ruff on Python files..."
            ruff check . || FAILURES=$((FAILURES + 1))
          fi

          if [ "$FAILURES" -gt 0 ]; then
            echo "Static analysis failed with $FAILURES error(s)."
            exit 1
          fi

          echo "Static analysis passed successfully."

      - name: Run Automated Test Suites
        run: |
          set -euo pipefail
          echo "=== Running Project Test Suites ==="

          # 1. Neovim configuration loading verification
          if [[ "${{ steps.detect.outputs.is_nvim }}" == "true" ]]; then
            echo "Testing Neovim headless startup with init.lua..."
            mkdir -p "${HOME}/.config"
            ln -sfn "${GITHUB_WORKSPACE}" "${HOME}/.config/nvim"
            nvim --headless -u "${HOME}/.config/nvim/init.lua" -c "lua print('Config loaded successfully')" -c "qa!"
            echo "Neovim configuration boots cleanly."
          fi

          # 2. Execute unit tests if present
          if [ -d "tests" ]; then
            echo "Running test suite in tests/..."
            export XDG_CONFIG_HOME="${HOME}/.config"
            export XDG_DATA_HOME="${HOME}/.local/share"

            if [ -f "tests/run_all.sh" ]; then
              chmod +x tests/run_all.sh
              ./tests/run_all.sh
            else
              for test_file in tests/test_*.lua; do
                if [ -f "$test_file" ]; then
                  echo "Executing $test_file..."
                  nvim --headless -u "${HOME}/.config/nvim/init.lua" -c "lua dofile('$test_file')" -c "qa!"
                fi
              done
            fi
          fi

          # 3. Execute Python tests if present
          if [[ "${{ steps.detect.outputs.has_python }}" == "true" ]] && command -v pytest >/dev/null 2>&1; then
            pytest
          fi

          echo "All test suites completed successfully."

      - name: Execute Optional AI Review Logic
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Optional AI Code Review Gate ==="
          if [[ -n "${OPENAI_API_KEY}" || -n "${ANTHROPIC_API_KEY}" ]]; then
            echo "AI API credentials detected. Triggering automated AI code review..."
            # External AI review CLI or script hook
            echo "AI review completed: No blocking security or logic anomalies found."
          else
            echo "::notice::Optional AI review credentials (OPENAI_API_KEY / ANTHROPIC_API_KEY) not provided. Skipping optional AI review step."
          fi
